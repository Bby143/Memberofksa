<div class="container">

  <h1>POGA KSA Member Registration</h1>

  <div class="form">

    <input
      type="text"
      id="fullName"
      placeholder="Full Name"
      required
    >

    <input
      type="text"
      id="memberCode"
      placeholder="Member Code"
    >

    <input
      type="tel"
      id="phone"
      placeholder="Contact Number"
    >

    <input
      type="email"
      id="email"
      placeholder="Email Address"
    >

    <label for="birthday">Birthday</label>
    <input
      type="date"
      id="birthday"
    >

    <input
      type="text"
      id="passportNumber"
      placeholder="Passport Number"
    >

    <textarea
      id="address"
      placeholder="Address"
      rows="3"
    ></textarea>

    <input
      type="text"
      id="emergencyContactPerson"
      placeholder="Emergency Contact Person"
    >

    <input
      type="tel"
      id="emergencyContactNumber"
      placeholder="Emergency Contact Number"
    >

    <label for="photo">Member Photo</label>

    <input
      type="file"
      id="photo"
      accept="image/jpeg,image/png,image/webp"
    >

    <button
      id="saveButton"
      onclick="saveMember()"
    >
      Add Member
    </button>

  </div>


  <!-- SEARCH -->

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search member..."
    onkeyup="searchMember()"
  >


  <!-- MEMBERS TABLE -->

  <table>

    <thead>

      <tr>
        <th>Member Code</th>
        <th>Name</th>
        <th>Contact</th>
        <th>Email</th>
        <th>Address</th>
        <th>Action</th>
      </tr>

    </thead>

    <tbody id="memberTable"></tbody>

  </table>

</div>
